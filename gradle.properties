# Project settings
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Android
android.nonTransitiveRClass=true
android.enableArtifactTransformCache=true
android.r8.fullMode=true
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.compilation=true

# Compose (compiler integrated into Kotlin plugin since 2.0)

# KSP
ksp.incremental=true
ksp.incremental.intermodule=true

# Detekt
detekt.failOnError=true

# Ktlint
ktlint.failOnError=true