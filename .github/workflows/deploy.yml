name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v4.3.0
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'RELEASE_STORE_FILE=%s\n' "/tmp/release.jks" >> ~/.gradle/gradle.properties
          printf 'RELEASE_STORE_[REDACTED:password] "$STORE_PW" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_[REDACTED:password] "$KEY_PW" >> ~/.gradle/gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Build release AAB
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'RELEASE_STORE_FILE=%s\n' "/tmp/release.jks" >> ~/.gradle/gradle.properties
          printf 'RELEASE_STORE_[REDACTED:password] "$STORE_PW" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_[REDACTED:password] "$KEY_PW" >> ~/.gradle/gradle.properties
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30