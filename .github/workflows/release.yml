name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/release.jks" >> ~/.gradle/gradle.properties
          printf 'RELEASE_STORE_[REDACTED:password] "$STORE_PW" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_[REDACTED:password] "$KEY_PW" >> ~/.gradle/gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/release.jks" >> ~/.gradle/gradle.properties
          printf 'RELEASE_STORE_[REDACTED:password] "$STORE_PW" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> ~/.gradle/gradle.properties
          printf 'RELEASE_KEY_[REDACTED:password] "$KEY_PW" >> ~/.gradle/gradle.properties
          ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
